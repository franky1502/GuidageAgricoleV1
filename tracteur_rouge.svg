<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <title>Tracteur rouge</title>
  <!-- Roues avant, plus petites -->
  <g fill="#202124" stroke="#111111" stroke-width="2.5">
    <rect x="24" y="42" width="19" height="43" rx="5"/><rect x="117" y="42" width="19" height="43" rx="5"/>
    <!-- Roues arrière, larges -->
    <rect x="8" y="126" width="32" height="64" rx="6"/><rect x="120" y="126" width="32" height="64" rx="6"/>
  </g>
  <!-- Relief de pneus en traits simples, sans ombre -->
  <g fill="none" stroke="#777777" stroke-width="3" stroke-linecap="round">
    <path d="M27 49 l12 8 M27 60 l12 8 M27 71 l12 8 M120 49 l12 8 M120 60 l12 8 M120 71 l12 8"/>
    <path d="M12 136 l24 10 M12 148 l24 10 M12 160 l24 10 M12 172 l24 10 M124 136 l24 10 M124 148 l24 10 M124 160 l24 10 M124 172 l24 10"/>
  </g>
  <!-- Châssis et carrosserie -->
  <path d="M48 25 Q48 14 59 14 H101 Q112 14 112 25 V188 Q112 198 102 198 H58 Q48 198 48 188 Z" fill="#FF0000" stroke="#111111" stroke-width="3"/>
  <!-- Capot avant : uni, sans fenêtre bleue -->
  <path d="M57 20 Q57 12 66 12 H94 Q103 12 103 20 V67 H57 Z" fill="#FF0000" stroke="#111111" stroke-width="2.5"/>
  <rect x="68" y="16" width="24" height="6" rx="2" fill="#FFEB3B" stroke="#111111" stroke-width="1.5"/>
  <!-- Cabine -->
  <rect x="52" y="72" width="56" height="49" rx="5" fill="#B0BEC5" stroke="#111111" stroke-width="3"/>
  <rect x="58" y="78" width="44" height="37" rx="2" fill="#78909C" stroke="#263238" stroke-width="2"/>
  <path d="M80 79 V114 M59 96 H101" stroke="#CFD8DC" stroke-width="2"/>
  <!-- Ailes arrière -->
  <path d="M42 126 Q42 119 51 119 H64 V186 H49 Q42 186 42 177 Z" fill="#FF0000" stroke="#111111" stroke-width="2.5"/>
  <path d="M96 119 H109 Q118 119 118 126 V177 Q118 186 109 186 H96 Z" fill="#FF0000" stroke="#111111" stroke-width="2.5"/>
  <!-- Arrière et attelage -->
  <path d="M59 126 H101 V190 H59 Z" fill="#FF0000" stroke="#111111" stroke-width="2.5"/>
  <rect x="67" y="168" width="26" height="10" rx="2" fill="#BDBDBD" stroke="#111111" stroke-width="2"/>
  <rect x="72" y="181" width="16" height="9" rx="1" fill="#424242" stroke="#111111" stroke-width="1.5"/>
  <path d="M69 198 H91 L87 208 H73 Z" fill="#616161" stroke="#111111" stroke-width="2"/>
</svg>